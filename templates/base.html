<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>{% block title %}Portfolio{% endblock %} — Hidayat Eka Saputra</title>
    <meta name="description" content="Portofolio personal Hidayat Eka Saputra — Mahasiswa Informatika, Software Engineer Enthusiast.">
    <meta name="author" content="Hidayat Eka Saputra">

    <!-- Open Graph -->
    <meta property="og:title" content="Hidayat Eka Saputra — Portfolio">
    <meta property="og:description" content="Portofolio personal: proyek, keahlian, dan perjalanan sebagai pengembang.">
    <meta property="og:type" content="website">

    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

    <!-- Custom CSS (Tailwind build) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% if request.endpoint == 'index' %}no-scroll{% endif %}">

    {% include 'components/navbar.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% if request.endpoint != 'index' %}
        {% include 'components/footer.html' %}
    {% endif %}

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            once: true,
            offset: 100,
            easing: 'ease-out-cubic'
        });
    </script>

    <!-- Mobile Menu Toggle -->
    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        const iconOpen = document.getElementById('icon-open');
        const iconClose = document.getElementById('icon-close');

        if (menuToggle) {
            menuToggle.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
                iconOpen.classList.toggle('hidden');
                iconClose.classList.toggle('hidden');
            });
        }
    </script>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
